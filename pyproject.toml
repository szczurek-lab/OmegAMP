[build-system]
requires = ["flit_core >=3.7,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "project"
dynamic = ["version", "description"]
authors = [
    {name = "Your Name", email = "you@tum.de"},
]
dependencies = [
    # PyTorch etc.
    "torch ~= 2.2",
    "lightning ~= 2.2",
    "torchmetrics",
    "torchvision",
    "einops",

    # General science & ml
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",

    # Plotting & visualization
    "matplotlib",
    "seaborn",

    # Data formats
    "h5py",

    # hydra & logging
    "hydra-core ~= 1.3",
    "hydra-submitit-launcher",
    "wandb ~= 0.16",

    # Utilities
    "tqdm",
    "rich",
    "ipython",
    "ipdb",
    "jupyterlab",
    "ipympl",
    "pytimeparse",

    # Project Specific
    "fair-esm==2.0.0",
    "transformers",
    "modlamp",
    "xgboost",
    "biopython",
    "peptides",
    "gdown",
    "streamlit",
    "levenshtein",
    "peptidy"
]
requires-python = ">= 3.11"
license = {text = "MIT"}

[tool.ruff]
line-length = 90
